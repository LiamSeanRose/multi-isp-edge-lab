! Startup-config last modified at Fri May  1 00:23:48 2026 by root
! device: ce1 (cEOSLab, EOS-4.36.0F-47083774.4360F (engineering build))
!
no aaa root
!
no service interface inactive port-id allocation disabled
!
service routing protocols model multi-agent
!
hostname ce1
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
vlan 10
   name internal_lan
!
interface Ethernet1
   description to-isp_a
   no switchport
   ip address 100.64.1.0/31
!
interface Ethernet2
   description to-isp_b
   no switchport
   ip address 100.64.2.0/31
!
interface Ethernet3
   description to-isp_c
   no switchport
   ip address 100.64.3.0/31
!
interface Ethernet4
   description to-host1
   switchport access vlan 10
!
interface Ethernet5
   description to-host2
   switchport access vlan 10
!
interface Management0
   ip address 172.30.30.10/24
!
interface Vlan10
   description internal-lan-gateway
   ip address 10.10.10.1/24
!
ip routing
!
router bgp 65010
   router-id 10.10.10.1
   no bgp default ipv4-unicast
   maximum-paths 3 ecmp 3
   neighbor 100.64.1.1 remote-as 65001
   neighbor 100.64.1.1 description isp_a-premium-fiber
   neighbor 100.64.2.1 remote-as 65002
   neighbor 100.64.2.1 description isp_b-standard-cable
   neighbor 100.64.3.1 remote-as 65003
   neighbor 100.64.3.1 description isp_c-lte-backup
   !
   address-family ipv4
      neighbor 100.64.1.1 activate
      neighbor 100.64.2.1 activate
      neighbor 100.64.3.1 activate
      network 10.10.10.0/24
!
end
