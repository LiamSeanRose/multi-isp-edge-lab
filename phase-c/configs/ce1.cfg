! Startup-config last modified at Tue May  5 02:27:41 2026 by root
! device: ce1 (cEOSLab, EOS-4.36.0F-47083774.4360F (engineering build))
!
no aaa root
!
no service interface inactive port-id allocation disabled
!
service routing protocols model multi-agent
!
hostname ce1
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
vlan 10
   name internal_lan
!
interface Ethernet1
   description to-isp_a
   no switchport
   ip address 100.64.1.0/31
!
interface Ethernet2
   description to-isp_b
   no switchport
   ip address 100.64.2.0/31
!
interface Ethernet3
   description to-isp_c
   no switchport
   ip address 100.64.3.0/31
!
interface Ethernet4
   description to-host1
   switchport access vlan 10
!
interface Ethernet5
   description to-host2
   switchport access vlan 10
!
interface Management0
   ip address 172.30.30.10/24
!
interface Vlan10
   description internal-lan-gateway
   ip address 10.10.10.1/24
!
ip routing
!
ip prefix-list PL-EXPECTED-INTERNET seq 10 permit 8.8.8.0/24
ip prefix-list PL-EXPECTED-INTERNET seq 20 permit 1.1.1.0/24
ip prefix-list PL-EXPECTED-INTERNET seq 30 permit 192.0.2.0/24
ip prefix-list PL-MY-PREFIXES seq 10 permit 10.10.10.0/24
!
ip route 1.1.1.1/32 100.64.2.1
ip route 8.8.8.8/32 100.64.1.1
ip route 192.0.2.1/32 100.64.3.1
!
route-map RM-FROM-ISP_A-IN permit 10
   description Tag isp_a routes as premium (local-pref 200)
   match ip address prefix-list PL-EXPECTED-INTERNET
   set community 65010:100
   set local-preference 200
!
route-map RM-FROM-ISP_B-IN permit 10
   description Tag isp_b routes as standard (local-pref 100)
   match ip address prefix-list PL-EXPECTED-INTERNET
   set community 65010:200
   set local-preference 100
!
route-map RM-FROM-ISP_C-IN permit 10
   description Tag isp_c routes as backup (local-pref 50)
   match ip address prefix-list PL-EXPECTED-INTERNET
   set community 65010:300
   set local-preference 50
!
route-map RM-TO-ISP_A-OUT permit 10
   description Permit only my prefixes outbound to isp_a
   match ip address prefix-list PL-MY-PREFIXES
!
route-map RM-TO-ISP_B-OUT permit 10
   description Prepend 1x to make isp_b less attractive inbound
   match ip address prefix-list PL-MY-PREFIXES
   set as-path prepend 65010
!
route-map RM-TO-ISP_C-OUT permit 10
   description Prepend 3x to make isp_c last-resort inbound
   match ip address prefix-list PL-MY-PREFIXES
   set as-path prepend 65010 65010
!
router bgp 65010
   router-id 10.10.10.1
   no bgp default ipv4-unicast
   maximum-paths 3 ecmp 3
   neighbor 100.64.1.1 remote-as 65001
   neighbor 100.64.1.1 description isp_a-premium-fiber
   neighbor 100.64.1.1 send-community
   neighbor 100.64.2.1 remote-as 65002
   neighbor 100.64.2.1 description isp_b-standard-cable
   neighbor 100.64.2.1 send-community
   neighbor 100.64.3.1 remote-as 65003
   neighbor 100.64.3.1 description isp_c-lte-backup
   neighbor 100.64.3.1 send-community
   !
   address-family ipv4
      neighbor 100.64.1.1 activate
      neighbor 100.64.1.1 route-map RM-FROM-ISP_A-IN in
      neighbor 100.64.1.1 route-map RM-TO-ISP_A-OUT out
      neighbor 100.64.2.1 activate
      neighbor 100.64.2.1 route-map RM-FROM-ISP_B-IN in
      neighbor 100.64.2.1 route-map RM-TO-ISP_B-OUT out
      neighbor 100.64.3.1 activate
      neighbor 100.64.3.1 route-map RM-FROM-ISP_C-IN in
      neighbor 100.64.3.1 route-map RM-TO-ISP_C-OUT out
      network 10.10.10.0/24
!
end
