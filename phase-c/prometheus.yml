global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets:
          - 8.8.8.8
          - 1.1.1.1
          - 192.0.2.1
        labels:
          group: 'per-isp-probes'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 172.30.30.115:9115
      - source_labels: [__param_target]
        regex: '8.8.8.8'
        target_label: isp
        replacement: 'isp_a'
      - source_labels: [__param_target]
        regex: '1.1.1.1'
        target_label: isp
        replacement: 'isp_b'
      - source_labels: [__param_target]
        regex: '192.0.2.1'
        target_label: isp
        replacement: 'isp_c'

  - job_name: 'blackbox-exporter'
    static_configs:
      - targets: ['172.30.30.115:9115']
